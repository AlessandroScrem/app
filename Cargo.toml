[package]
name = "app_wgpu"
version = "0.1.0"
edition = "2024"
default-run = "app_wgpu"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "ldr_bench"
path = "benches/load_ldr.rs"
harness = false

[[bench]]
name = "hdr_bench"
path = "benches/load_hdr.rs"
harness = false

[[bench]]
name = "entity_hash_bench"
path = "benches/entity_hash.rs"
harness = false

[features]
default = []
save_tests = []

[dependencies]
winit = "0.30.9"
wgpu = "29.0"
rfd = "0.15.4"                                                       #RustFileDialog
imgui-wgpu = "0.28.0"
imgui = { version = "0.12.0", features = ["docking", "tables-api"] }
imgui-winit-support = "0.13.0"
# 
legion = { version = "0.4.0", features = ["extended-tuple-impls"] }
cgmath = "0.18.0"
bytemuck = { version = "1.16", features = ["derive"] }
mikktspace = { version = "0.3.0", default-features = false, features = [
    "glam",
] }
#
gltf = { version = "1.4.1", features = [
    "KHR_materials_transmission",
    "KHR_materials_volume",
    "KHR_materials_ior",
    "KHR_texture_transform",
    "extensions",
] }
image = "0.25.6"
half = "2.6.0"
stb_image = "0.3.0"
strum = "0.27.2"
strum_macros = "0.27.2"
log = "0.4.28"
# bitflags = "2.11.0"

clap = "2.33.0"
env_logger = "0.11.8"
colored = "3.0.0"
slotmap = "1.1.1"
# nofmt = "1.0.0"

#
rayon = "1.11.0"
pollster = "0.4.0"
smol = "1.2"

#
anyhow = "1.0.99"
thiserror = "2.0.18"
serde_json = "1.0.149"

[build-dependencies]
image = "0.25.6"
