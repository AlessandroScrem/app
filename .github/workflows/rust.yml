name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
         path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
         restore-keys: |
          ${{ runner.os }}-cargo-

      - name: Install wgpu dependencies
        run: |
         sudo apt-get update
         sudo apt-get install -y libvulkan1  mesa-vulkan-drivers 

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (Debug)
        run: cargo build --verbose

      - name: Test 
        run: cargo test --verbose

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
         path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
         restore-keys: |
          ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (Debug)
        run: cargo build --verbose

# todo: macos not find wgpu adapter
#      - name: Test (headless)
#        env:
#          WGPU_BACKEND: noop
#        run: cargo test --verbose

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
         path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
         restore-keys: |
          ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (Debug)
        run: cargo build --verbose

      - name: Test 
        run: cargo test --verbose
