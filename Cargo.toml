[package]
name = "app_wgpu"
version = "0.1.0"
edition = "2024"
default-run = "app_wgpu"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "ldr_bench"
path = "benches/load_ldr.rs"
harness = false

[[bench]]
name = "hdr_bench"
path = "benches/load_hdr.rs"
harness = false

[[bench]]
name = "entity_hash_bench"
path = "benches/entity_hash.rs"
harness = false

[features]
default = []
save_tests = []

[dependencies]
winit = "0.30.9"
wgpu = "25.0"
imgui-wgpu = "0.25.0"
imgui = { version = "0.12.0", features = ["docking"] }
imgui-winit-support = "0.13.0"
# 
legion = "0.4.0"
cgmath = "0.18.0"
bytemuck = { version = "1.16", features = [ "derive" ] }
#
pollster = "0.4.0"
gltf = "1.4.1"
image = "0.25.6"
half = "2.6.0"
strum = "0.27.2"
strum_macros = "0.27.2"
anyhow = "1.0.99"
rayon = "1.11.0"
stb_image = "0.3.0"
rfd = "0.15.4"
log = "0.4.28"
env_logger = "0.11.8"
# nofmt = "1.0.0"

